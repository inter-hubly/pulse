<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <style>
        #messages {
            list-style-type: none;
            margin: 0;
            padding: 0;
            height: 200px;
            overflow-y: scroll;
        }

        #messages li {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
        .owner-message {
            color: white; /* Cor do texto */
            background-color: blue; /* Fundo da mensagem */
            padding: 5px; /* Espaçamento interno */
            border-radius: 4px; /* Borda arredondada */
        }

    </style>
</head>
<body>
<ul id="messages"></ul>
<form id="form">
    <input id="username" type="text" placeholder="Username" required disabled>
    <input id="message" type="text" placeholder="Message" required>
    <button type="submit">Send</button>
</form>
<form id="start-template">
    <button type="submit">Start Template</button>
</form>

<script>
    const userId = "515719138282305"
    const numberId = "15551817023"
    document.getElementById("username").value = numberId;

    function fetchMessages() {
        fetch(`http://localhost:8082/messages?user=${userId}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
                "userId": userId,
                "number": numberId
            }
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Erro na resposta: ${response.status}`);
                }
                return response.json();
            })
            .then(messages => {
                const messagesList = document.getElementById("messages");
                messages.forEach(msg => {
                    const item = document.createElement("li");
                    if (msg.isOwner) {
                        item.classList.add("owner-message");
                    }
                    item.textContent = msg.username + ": " + msg.message;
                    messagesList.appendChild(item);
                });
            })
            .catch(error => console.error("Erro ao buscar mensagens:", error));
    }

    const ws = new WebSocket(`ws://localhost:8082/ws?user=${userId}`);

    ws.onmessage = function (event) {
        const msg = JSON.parse(event.data);
        const item = document.createElement("li");
        if (msg.isOwner) {
            item.classList.add("owner-message");
        }
        item.textContent = msg.username + ": " + msg.message;
        document.getElementById("messages").appendChild(item);
    };

    document.getElementById("form").onsubmit = function (event) {
        event.preventDefault();
        const username = document.getElementById("username").value;
        const message = document.getElementById("message").value;
        ws.send(JSON.stringify({
            "toId": "+5548991784586",
            "ownerId": username,
            "message": message,
            "isOwner":true,
        }));

        document.getElementById("message").value = '';
    };

    document.getElementById("start-template").onsubmit = function (event) {
        fetch(`http://localhost:8082/template?user=${userId}&toId=+5548991784586`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        });

        event.preventDefault();

        document.getElementById("message").value = '';
    };


    window.onload = function () {
        fetchMessages();
    };
</script>

</body>
</html>

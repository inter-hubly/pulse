<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App - Dois Chats</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .chat-container {
            display: flex;
            width: 80%;
            height: 80%;
        }

        .chat-box {
            flex: 1;
            margin: 10px;
            border: 1px solid #ddd;
            padding: 10px;
            display: flex;
            flex-direction: column;
            background-color: #f9f9f9;
        }

        #messages {
            list-style-type: none;
            margin: 0;
            padding: 0;
            flex: 1;
            overflow-y: scroll;
            border: 1px solid #ddd;
            padding: 5px;
        }

        #messages li {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        .owner-message {
            color: white;
            background-color: blue;
            padding: 5px;
            border-radius: 4px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            padding: 8px;
            border: 1px solid #ddd;
            flex: 1;
        }

        button {
            padding: 8px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        .iniciar-template {
            padding: 8px;
            background-color: #4c9baf;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .disconnect-btn {
            background-color: #f44336;
        }

        .disconnect-btn:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Chat 1 -->
    <div class="chat-box">
        <h2>Ribeiro</h2>
        <ul id="messages1"></ul>
        <form id="form1">
            <input id="message1" type="text" placeholder="Message" required>
            <div>
                <button type="button" id="connect1">Connect</button>
                <button type="button" id="disconnect1" class="disconnect-btn">Disconnect</button>
            </div>
            <button type="submit">Send</button>
        </form>
        <button id="startTemplateButton1" class="iniciar-template">Iniciar template</button>
    </div>

    <!-- Chat 2 -->
    <div class="chat-box">
        <h2>Saimon</h2>
        <ul id="messages2"></ul>
        <form id="form2">
            <input id="message2" type="text" placeholder="Message" required>
            <div>
                <button type="button" id="connect2">Connect</button>
                <button type="button" id="disconnect2" class="disconnect-btn">Disconnect</button>
            </div>
            <button type="submit">Send</button>
        </form>
        <button id="startTemplateButton2" class="iniciar-template">Iniciar template</button>
    </div>
</div>

<script>
    let ws1 = null;
    let ws2 = null;
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get("userId");

    function createWebSocket(chatId, toNumber) {
        const ws = new WebSocket(`ws://localhost:8082/ws?user=${userId}&toNumber=${toNumber}`);

        ws.onopen = () => {
            console.log(`WebSocket conectado para ${chatId}`);
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            const messageElement = document.createElement("li");
            messageElement.textContent = `${msg.senderId}: ${msg.message}`;
            if (msg.isOwner) {
                messageElement.classList.add("owner-message");
            }
            document.getElementById(chatId).appendChild(messageElement);
        };

        ws.onerror = (error) => {
            console.error(`Erro no WebSocket para ${chatId}:`, error);
        };

        ws.onclose = () => {
            console.log(`WebSocket desconectado para ${chatId}`);
        };

        return ws;
    }

    // Chat 1
    document.getElementById("connect1").onclick = () => {
        if (!ws1 || ws1.readyState !== WebSocket.OPEN) {
            ws1 = createWebSocket("messages1", "%2B5548988356622");
        }
    };

    document.getElementById("disconnect1").onclick = () => {
        if (ws1 && ws1.readyState === WebSocket.OPEN) {
            ws1.close();
            ws1 = null;
        }
    };

    document.getElementById("form1").onsubmit = (event) => {
        event.preventDefault();
        if (ws1 && ws1.readyState === WebSocket.OPEN) {
            const message = document.getElementById("message1").value;
            ws1.send(JSON.stringify({
                "toNumber": "+5548988356622",
                "ownerId": "Chat1",
                "message": message,
                "isOwner": true,
            }));
            document.getElementById("message1").value = '';
        } else {
            alert("Conecte-se primeiro ao WebSocket para enviar mensagens.");
        }
    };

    // Chat 2
    document.getElementById("connect2").onclick = () => {
        if (!ws2 || ws2.readyState !== WebSocket.OPEN) {
            ws2 = createWebSocket("messages2", "%2B5548991784586");
        }
    };

    document.getElementById("disconnect2").onclick = () => {
        if (ws2 && ws2.readyState === WebSocket.OPEN) {
            ws2.close();
            ws2 = null;
        }
    };

    document.getElementById("form2").onsubmit = (event) => {
        event.preventDefault();
        if (ws2 && ws2.readyState === WebSocket.OPEN) {
            const message = document.getElementById("message2").value;
            ws2.send(JSON.stringify({
                "toNumber": "+5548991784586",
                "ownerId": "Chat2",
                "message": message,
                "isOwner": true,
            }));
            document.getElementById("message2").value = '';
        } else {
            alert("Conecte-se primeiro ao WebSocket para enviar mensagens.");
        }
    };

    function iniciarTemplate(id) {
        const number = id === 1 ? "+5548988356622" : "+5548991784586";

        document.getElementById("startTemplateButton" + id).onclick = () => {
            console.log(`Iniciando template para ${number}...`);

            fetch(`http://localhost:8082/template?user=${userId}`, {
                method: "GET",
                headers: {
                    "to-number": number,
                    "Content-Type": "application/json",
                },
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Erro: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("Resposta do servidor:", data);
                })
                .catch(error => {
                    console.error("Erro ao iniciar template:", error);
                });
        };
    }

    iniciarTemplate(1);
    iniciarTemplate(2);
</script>

</body>
</html>
